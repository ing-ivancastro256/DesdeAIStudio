    <script>
      // Compatibility shim for browser extensions attempting to wrap or set window.fetch
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(val) { _fetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Silently ignore if already defined
      }

      // Prevent unhandled errors from browser extensions from crashing the app
      window.addEventListener('error', function(event) {
        if (event.filename && event.filename.includes('chrome-extension://')) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
